{% extends "base.html" %}

{% block title %}Sign in · {{ site_name }}{% endblock %}

{% block content %}
<h1>Sign in</h1>
{% if form.errors %}<p class="notice notice-stop">The user name or password is not correct.</p>{% endif %}
<form method="post" class="stack">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="stack">
    <label for="id_username">User name</label>
    <input id="id_username" name="username" autocomplete="username" autocapitalize="none" required value="{{ form.username.value|default:'' }}">
  </div>
  <div class="stack">
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="btn btn-primary btn-block" type="submit">Sign in</button>
</form>
<p class="muted">New here? <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
{% endblock %}
