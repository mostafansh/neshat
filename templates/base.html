{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="icon" href="{% static 'img/brand.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/reading-room.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'home' %}">
      <svg class="brand-mark" width="20" height="20" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path class="brand-arc" d="M4.2 9.6c1.5-3.4 6.1-3.4 7.6 0" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>{{ site_name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Home</a>
    </nav>
  </header>
  <main id="main" class="site-main">
    {% for message in messages %}<p class="notice notice-{{ message.tags }}">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span class="muted">Research pilot. Not for clinical use.</span>
    {% if site_mode != "online" %}<span class="pill">{{ site_mode }} mode</span>{% endif %}
  </footer>
</body>
</html>
