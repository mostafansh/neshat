{% extends "base.html" %}

{% block content %}
<h1>Bring your expertise.</h1>
<p class="lede">We bring the data and the idea. You take part in research with very little to
learn outside radiology.</p>

<div class="btn-row">
  <a class="btn btn-primary" href="{% url 'projects' %}">See the projects</a>
  {% if not user.is_authenticated %}<a class="btn" href="{% url 'signup' %}">Create an account</a>{% endif %}
</div>

<figure class="stack">
  <div class="frame">
    <img src="{% url 'demo_image' %}" alt="Synthetic test radiograph, drawn by code. Not a patient.">
  </div>
  <figcaption class="muted">A synthetic test image, drawn by code. Not a patient.</figcaption>
</figure>
{% endblock %}
