[project]
name = "neshat"
version = "0.1.0"
description = "Reader-study and dataset-curation site for radiologists (pilot)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "pillow>=12.3.0",
    "waitress>=3.0.2",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
prep = [
    "nibabel>=5.4.2",
    "numpy>=2.5.3",
    "pydicom>=3.0.2",
    "scipy>=1.18.1",
]
